<!DOCTYPE html>

<helmet>
  <style>
    @font-face { font-family: 'Stinger'; src: url('./fonts/StingerTrial-Heavy.ttf') format('truetype'); font-weight: 800; }

    a { color: #683A95; }

  <div style="display:flex;gap:20px;margin-bottom:80px;">

    <div style="flex:1;background:#F9A11B;border-radius:4px;height:220px;display:flex;align-items:center;justify-content:center;"><img src="./assets/logo-branco-h.png" style="width:80%;height:auto;object-fit:contain;" /></div>
