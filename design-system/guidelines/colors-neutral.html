<!-- @dsCard group="Colors" viewport="700x220" subtitle="Superfícies e bordas" name="Neutros e superfícies" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:16px;padding:16px;font-family:var(--font-body);box-sizing:border-box;">
  <div style="flex:1;"><div style="height:100px;background:var(--surface-page);border-radius:var(--radius-sm);border:1px solid var(--border-default);"></div><div style="font-weight:700;color:var(--text-primary);font-size:15px;margin-top:8px;">Surface page</div><div style="opacity:0.7;font-size:13px;">#EDEAE6</div></div>
  <div style="flex:1;"><div style="height:100px;background:var(--surface-alt);border-radius:var(--radius-sm);border:1px solid var(--border-default);"></div><div style="font-weight:700;color:var(--text-primary);font-size:15px;margin-top:8px;">Surface alt (dot grid)</div><div style="opacity:0.7;font-size:13px;">#F1F0ED</div></div>
  <div style="flex:1;"><div style="height:100px;background:var(--surface-card);border-radius:var(--radius-sm);border:1px solid var(--border-default);"></div><div style="font-weight:700;color:var(--text-primary);font-size:15px;margin-top:8px;">Border default</div><div style="opacity:0.7;font-size:13px;">#D8D3CC</div></div>
  <div style="flex:1;"><div style="height:100px;background:var(--surface-card);border-radius:var(--radius-sm);border:1px solid var(--border-soft);"></div><div style="font-weight:700;color:var(--text-primary);font-size:15px;margin-top:8px;">Border soft</div><div style="opacity:0.7;font-size:13px;">#E5E1DC</div></div>
</div>
