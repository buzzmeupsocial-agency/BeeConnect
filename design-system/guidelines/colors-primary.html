<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:16px;padding:16px;font-family:var(--font-body);box-sizing:border-box;">
  <div style="flex:1;"><div style="height:120px;background:var(--color-orange);border-radius:var(--radius-sm);"></div><div style="font-weight:700;color:var(--text-primary);font-size:16px;margin-top:10px;">Laranja</div><div style="opacity:0.7;font-size:14px;">#F9A11B</div></div>
  <div style="flex:1;"><div style="height:120px;background:var(--color-black);border-radius:var(--radius-sm);"></div><div style="font-weight:700;color:var(--text-primary);font-size:16px;margin-top:10px;">Preto</div><div style="opacity:0.7;font-size:14px;">#3F3A39</div></div>
  <div style="flex:1;"><div style="height:120px;background:var(--color-white);border-radius:var(--radius-sm);border:1px solid var(--border-default);"></div><div style="font-weight:700;color:var(--text-primary);font-size:16px;margin-top:10px;">Branco</div><div style="opacity:0.7;font-size:14px;">#FFFFFF</div></div>
  <div style="flex:1;"><div style="height:120px;background:var(--color-purple);border-radius:var(--radius-sm);"></div><div style="font-weight:700;color:var(--text-primary);font-size:16px;margin-top:10px;">Roxo</div><div style="opacity:0.7;font-size:14px;">#683A95</div></div>
  <div style="flex:1;"><div style="height:120px;background:var(--color-green);border-radius:var(--radius-sm);"></div><div style="font-weight:700;color:var(--text-primary);font-size:16px;margin-top:10px;">Verde</div><div style="opacity:0.7;font-size:14px;">#72C064</div></div>
</div>
