<!-- @dsCard group="Brand" viewport="700x260" subtitle="Seta orange, anéis concêntricos, grid de pontos" name="Motivos gráficos" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:16px;padding:16px;box-sizing:border-box;">
  <div style="flex:1;position:relative;overflow:hidden;height:220px;border-radius:var(--radius-sm);background-color:var(--surface-alt);background-image:radial-gradient(circle at 1px 1px, rgba(63,58,57,0.08) 1px, transparent 0);background-size:14px 14px;">
    <div style="position:absolute;top:24px;left:24px;width:44px;height:44px;">
      <div style="position:absolute;width:32px;height:32px;border-top:6px solid var(--accent-primary);border-right:6px solid var(--accent-primary);transform:rotate(-45deg);top:0;left:6px;"></div>
      <div style="position:absolute;width:32px;height:32px;border-top:6px solid var(--accent-primary);border-right:6px solid var(--accent-primary);transform:rotate(-45deg);top:0;left:-14px;opacity:0.45;"></div>
    </div>
    <div style="font-family:var(--font-body);font-size:13px;color:var(--text-muted);position:absolute;bottom:12px;left:16px;">Grid de pontos + seta dupla</div>
  </div>
  <div style="flex:1;position:relative;overflow:hidden;height:220px;border-radius:var(--radius-sm);background:var(--surface-alt);">
    <div style="position:absolute;bottom:-50px;right:-50px;width:180px;height:180px;">
      <div style="position:absolute;inset:0;border:10px solid var(--accent-primary);border-radius:50%;"></div>
      <div style="position:absolute;inset:26px;border:10px solid var(--accent-primary);border-radius:50%;"></div>
      <div style="position:absolute;inset:52px;border:10px solid var(--accent-primary);border-radius:50%;"></div>
    </div>
    <div style="font-family:var(--font-body);font-size:13px;color:var(--text-muted);position:absolute;bottom:12px;left:16px;">Anéis concêntricos — canto inferior</div>
  </div>
</div>
