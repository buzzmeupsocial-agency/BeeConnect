<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Escala de espaçamento (8–120px)" name="Spacing scale" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;align-items:flex-end;gap:10px;padding:24px;font-family:var(--font-body);box-sizing:border-box;">
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:16px;height:var(--space-1);background:var(--accent-primary);"></div><div style="font-size:12px;opacity:0.7;">8</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:16px;height:var(--space-2);background:var(--accent-primary);"></div><div style="font-size:12px;opacity:0.7;">16</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:16px;height:var(--space-4);background:var(--accent-primary);"></div><div style="font-size:12px;opacity:0.7;">24</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:16px;height:var(--space-6);background:var(--accent-primary);"></div><div style="font-size:12px;opacity:0.7;">40</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:16px;height:var(--space-8);background:var(--accent-primary);"></div><div style="font-size:12px;opacity:0.7;">64</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;"><div style="width:16px;height:var(--space-10);background:var(--accent-primary);"></div><div style="font-size:12px;opacity:0.7;">120</div></div>
</div>
